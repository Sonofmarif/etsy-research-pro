<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Etsy Research Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Brand Header -->
  <div class="header">
    <div class="logo-group">
      <span class="logo-icon">📊</span>
      <div>
        <h1 id="header-title">Etsy Research Pro</h1>
        <span class="header-subtitle">Niche Research Copilot</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <!-- Primary Action: Open Full Dashboard -->
    <div class="action-section">
      <button class="btn btn-primary" id="btn-open-dashboard">
        <span class="btn-icon">📈</span> Open Full Analytics Dashboard
      </button>
    </div>

    <!-- Basic Configuration: Gemini API Key -->
    <div class="settings-group">
      <label class="settings-label" for="input-gemini-key">Gemini API Key</label>
      <div class="input-wrapper">
        <input type="password" id="input-gemini-key" class="settings-input" placeholder="Paste your Gemini API key" autocomplete="off">
        <span class="key-status" id="gemini-status">Not configured</span>
      </div>
      <p class="settings-hint">Your API key remains local in your browser and is never sent to external servers.</p>
    </div>

    <!-- Settings Accordion -->
    <details class="settings-accordion" id="settings-accordion">
      <summary class="accordion-summary">
        <span class="accordion-title">⚙️ Scraper Thresholds</span>
        <span class="accordion-chevron">▼</span>
      </summary>
      <div class="accordion-content">
        <div class="field-row">
          <div class="field-item">
            <label class="field-label" for="input-min-searches" title="Keep keyword recommendations with at least this search volume">
              Min Monthly Searches
            </label>
            <input type="number" id="input-min-searches" class="settings-input" value="500">
          </div>
        </div>
        <div class="field-row">
          <div class="field-item">
            <label class="field-label" for="input-max-competition" title="Filter out highly crowded terms exceeding this threshold">
              Max Competition
            </label>
            <input type="number" id="input-max-competition" class="settings-input" value="25000">
          </div>
        </div>
        <div class="field-row">
          <div class="field-item">
            <label class="field-label" for="input-delay-between-pages" title="Wait time (seconds) between opening listing and search pages">
              Delay Between Pages (seconds)
            </label>
            <input type="number" id="input-delay-between-pages" class="settings-input" value="5">
          </div>
        </div>
        <div class="field-row">
          <div class="field-item">
            <label class="field-label" for="input-max-shop-reviews" title="Shops with fewer reviews than this are considered beatable slots">
              Beatable Shop Reviews Max Threshold
            </label>
            <input type="number" id="input-max-shop-reviews" class="settings-input" value="300">
          </div>
        </div>
        <div class="field-row">
          <div class="field-item">
            <label class="field-label" for="input-min-beatable-slots" title="Minimum number of beatable slots required for a GO verdict">
              Min Beatable Slots Required
            </label>
            <input type="number" id="input-min-beatable-slots" class="settings-input" value="3">
          </div>
        </div>
      </div>
    </details>

    <!-- Save Controls -->
    <div class="save-section">
      <button class="btn btn-accent" id="btn-save-settings">Save Settings</button>
      <span class="saved-msg" id="settings-saved" style="display:none">✓ Settings Saved!</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>v1.0.0</span>
    <span class="footer-credits">Etsy Research Pro · Free & Open Source</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
